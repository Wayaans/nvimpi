<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers "How the prompt UI looks and behaves" (Wayaans/nvimpi#8).
  Three variants of the Instruction prompt + working animation on a mocked Neovim buffer.
  Mocked reply after 2.6 s. Nothing here is production code.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --row: 20px; }
  body { margin: 0; }
  .wrap { display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 12px; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group > span { color: var(--muted-foreground); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 3px 9px; font-size: 12px; color: var(--muted-foreground); }
  .seg button[aria-pressed="true"] { background: var(--secondary); color: var(--foreground); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions button { font: 12px var(--font-mono); background: var(--secondary); color: var(--secondary-foreground);
    border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 3px 8px; cursor: pointer; }
  .actions button kbd { color: var(--muted-foreground); font: inherit; margin-right: 4px; }

  .ed { position: relative; background: var(--code-background); border-radius: var(--radius); padding-top: 16px;
    font: 13px/var(--row) var(--font-mono); overflow: hidden; outline: none; }
  .ed:focus-visible { box-shadow: 0 0 0 1px var(--ring); }
  .row { height: var(--row); white-space: pre; display: flex; }
  .gut { width: 5ch; box-sizing: border-box; padding-right: 1ch; text-align: right; color: var(--muted-foreground); opacity: .55; flex: none; }
  .txt { flex: 1; }
  .tilde { color: var(--muted-foreground); opacity: .4; }
  .sel .txt { background: color-mix(in srgb, var(--info) 28%, transparent); }
  .pending .txt { background: color-mix(in srgb, var(--muted-foreground) 14%, transparent); }
  .shimmer .txt { background: color-mix(in srgb, var(--primary) 30%, transparent); }
  .k { color: var(--chart-4); } .s { color: var(--chart-2); } .n { color: var(--chart-3); } .c { color: var(--muted-foreground); font-style: italic; }

  .status { display: flex; justify-content: space-between; height: var(--row); margin-top: 4px; padding-right: 1ch;
    background: color-mix(in srgb, var(--foreground) 8%, transparent); }
  .status .mode { padding: 0 1ch; font-weight: 600; background: color-mix(in srgb, var(--primary) 35%, transparent); }
  .cmd { height: var(--row); padding: 0 1ch 4px; white-space: pre; display: flex; }
  .ERROR { color: var(--destructive); } .WARN { color: var(--warning); } .INFO { color: var(--muted-foreground); }

  .cursor { position: absolute; width: 1ch; height: var(--row); background: var(--foreground); opacity: .65; }
  .virt { position: absolute; white-space: pre; color: var(--muted-foreground); font-style: italic; }
  .float { position: absolute; background: var(--code-background); border: 1px solid var(--muted-foreground);
    border-radius: 6px; padding: 6px 1ch 4px; box-shadow: 0 6px 24px rgb(0 0 0 / .35); }
  .float .title, .float .foot { position: absolute; left: 1.5ch; padding: 0 .5ch; background: var(--code-background); white-space: pre; line-height: 1; }
  .float .title { top: -.55em; color: var(--foreground); font-weight: 600; }
  .float .foot { bottom: -.5em; left: auto; right: 1.5ch; color: var(--muted-foreground); }
  .line { height: var(--row); white-space: pre; display: flex; }
  .dim { color: var(--muted-foreground); }
  input.prompt { all: unset; flex: 1; font: inherit; color: var(--foreground); caret-color: var(--foreground); }

  pre.state { margin: 0; font: 11.5px/1.5 var(--font-mono); color: var(--muted-foreground); white-space: pre-wrap; }
  pre.state b { color: var(--foreground); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="controls"></div>
  <div class="actions" id="actions"></div>
  <div class="ed" id="ed" tabindex="0"></div>
  <pre class="state" id="state"></pre>
</div>
<script>
const INIT = [
  "local M = {}",
  "",
  "function M.sum(list)",
  "  local total = 0",
  "  for i = 1, #list do",
  "    total = total + list[i]",
  "  end",
  "  return total",
  "end",
  "",
  "function M.avg(list)",
  "  ",
  "end",
  "",
  "return M",
];
const ROWS = 17;
const SPIN = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
const MOCK = {
  rewrite: ["function M.sum(list)", "  local total = 0", "  for _, n in ipairs(list) do", "    total = total + n", "  end", "  return total", "end"],
  inline: ["if #list == 0 then return 0 end", "  return M.sum(list) / #list"],
  newline: ["  if #list == 0 then return 0 end", "  return M.sum(list) / #list"],
};
const VARIANTS = { A: "Cursor float", B: "Centered panel", C: "Cmdline" };

const S = {
  variant: "A", mode: "rewrite", placement: "inline", second: "refuse", outcome: "ok",
  lines: [...INIT], undo: [], sel: { s: 2, e: 8 }, cur: { r: 11, c: 2 },
  prompt: false, draft: "", req: null, lastFailed: "", msg: null, tick: 0, log: [], nextId: 1,
};

const $ = (id) => document.getElementById(id);
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hl(t) {
  const re = /(--.*$)|("[^"]*")|\b(local|function|end|for|do|return|if|then|in|and|or|not|nil)\b|\b(\d+)\b/g;
  let out = "", i = 0, m;
  while ((m = re.exec(t))) {
    out += esc(t.slice(i, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : "n";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    i = re.lastIndex;
  }
  return out + esc(t.slice(i));
}
function log(e) { S.log.push(e); if (S.log.length > 5) S.log.shift(); }
function notify(text, level) { S.msg = { text, level, at: Date.now() }; }
const elapsed = () => S.req ? ((Date.now() - S.req.started) / 1000).toFixed(0) + "s" : "";
const spin = () => SPIN[S.tick % SPIN.length];
const targetRows = (r) => r.mode === "rewrite" ? [r.target.s, r.target.e] : [r.target.r, r.target.r];

// ---- behaviour ----------------------------------------------------------
function openPrompt() {
  if (S.prompt) return;
  if (S.req && S.second === "refuse") {
    notify("nvimpi: a request is already running (<C-c> cancels it)", "WARN");
    log("prompt refused: request running");
    return render();
  }
  S.prompt = true; S.draft = S.lastFailed; S.msg = null;
  log(S.lastFailed ? "prompt opened, prefilled with failed Instruction" : "prompt opened");
  render();
}
function closePrompt() { S.prompt = false; log("prompt closed (no request)"); render(); $("ed").focus(); }
function submit(text) {
  if (!text.trim()) return closePrompt();
  if (S.req) { clearTimeout(S.req.timer); log("old request killed (replaced)"); S.req = null; }
  S.prompt = false; S.lastFailed = "";
  const id = S.nextId++;
  S.req = { id, instr: text, started: Date.now(), mode: S.mode, placement: S.placement,
    target: S.mode === "rewrite" ? { ...S.sel } : { ...S.cur }, dirty: false,
    timer: setTimeout(() => finish(id), 2600) };
  log(`request #${id} sent: "${text}"`);
  render(); $("ed").focus();
}
function cancel() {
  if (!S.req) return;
  clearTimeout(S.req.timer);
  log(`request #${S.req.id} cancelled (silent, buffer untouched)`);
  S.req = null; render();
}
function finish(id) {
  const r = S.req;
  if (!r || r.id !== id) return;
  S.req = null;
  if (S.outcome === "err") {
    S.lastFailed = r.instr;
    notify("nvimpi: anthropic: 429 rate limit exceeded", "ERROR");
    log(`request #${id} failed, Instruction kept for next prompt`);
  } else if (r.dirty) {
    S.lastFailed = r.instr;
    notify("nvimpi: text changed, result discarded", "WARN");
    log(`request #${id} discarded (target edited)`);
  } else {
    apply(r);
    log(`request #${id} applied as one undo step`);
  }
  render();
}
function apply(r) {
  S.undo.push({ lines: [...S.lines], sel: { ...S.sel }, cur: { ...S.cur } });
  if (r.mode === "rewrite") {
    const { s, e } = r.target;
    S.lines.splice(s, e - s + 1, ...MOCK.rewrite);
    S.sel = { s, e: s + MOCK.rewrite.length - 1 };
  } else if (r.placement === "inline") {
    const { r: row, c } = r.target;
    const line = S.lines[row], out = [...MOCK.inline];
    out[0] = line.slice(0, c) + out[0];
    out[out.length - 1] += line.slice(c);
    S.lines.splice(row, 1, ...out);
    S.cur = { r: row + out.length - 1, c: out[out.length - 1].length - line.slice(c).length - 1 };
  } else {
    const row = r.target.r;
    S.lines.splice(row + 1, 0, ...MOCK.newline);
    S.cur = { r: row + MOCK.newline.length, c: 2 };
  }
}
function undo() {
  const u = S.undo.pop();
  if (!u) return notify("Already at oldest change", "INFO"), render();
  Object.assign(S, { lines: u.lines, sel: u.sel, cur: u.cur });
  notify(`1 change; before #${S.undo.length + 1}`, "INFO");
  render();
}
function editTarget() {
  if (!S.req) return notify("start a request first", "INFO"), render();
  const [row] = targetRows(S.req);
  S.lines[row] += "  -- edited";
  S.req.dirty = true;
  log("target text edited while waiting");
  render();
}
function setMode(m) { if (!S.prompt) { S.mode = m; render(); } }
function reset() {
  if (S.req) clearTimeout(S.req.timer);
  Object.assign(S, { lines: [...INIT], undo: [], sel: { s: 2, e: 8 }, cur: { r: 11, c: 2 }, prompt: false,
    draft: "", req: null, lastFailed: "", msg: null, log: [] });
  render();
}

// ---- rendering ----------------------------------------------------------
function seg(label, key, opts) {
  return `<div class="group"><span>${label}</span><div class="seg">` +
    opts.map(([v, t]) => `<button data-set="${key}" data-val="${v}" aria-pressed="${S[key] === v}">${t}</button>`).join("") +
    `</div></div>`;
}
function renderControls() {
  $("controls").innerHTML =
    seg("Variant", "variant", Object.entries(VARIANTS).map(([k, v]) => [k, `${k} · ${v}`])) +
    seg("Insert lands", "placement", [["inline", "inline at cursor"], ["newline", "new line below"]]) +
    seg("Prompt while running", "second", [["refuse", "refuse"], ["replace", "replace old"]]) +
    seg("Mock reply", "outcome", [["ok", "success"], ["err", "error"]]);
  $("actions").innerHTML = [
    ["V", "select 3–9 (Rewrite)", "rewrite"], ["Esc", "cursor only (Insert)", "insert"],
    ["␣a", "open prompt", "open"], ["^C", "cancel", "cancel"],
    ["", "edit target while waiting", "edit"], ["u", "undo", "undo"], ["", "reset", "reset"],
  ].map(([k, t, a]) => `<button data-act="${a}">${k ? `<kbd>${k}</kbd>` : ""}${t}</button>`).join("");
}
function rowHtml(i) {
  const t = S.lines[i];
  if (t === undefined) return `<div class="row"><span class="gut"></span><span class="txt tilde">~</span></div>`;
  let cls = "";
  if (S.mode === "rewrite" && !S.req && i >= S.sel.s && i <= S.sel.e) cls = "sel";
  if (S.req) {
    const [a, b] = targetRows(S.req);
    if (i >= a && i <= b) {
      if (S.variant === "A") cls = "pending";
      if (S.variant === "C") {
        // a highlight that sweeps down the target lines, one row per tick-step
        const n = b - a + 1, step = Math.floor(S.tick / 2) % (n + 2);
        if (i - a === step || (n === 1 && step % 2 === 0)) cls = "shimmer";
      }
    }
  }
  return `<div class="row ${cls}"><span class="gut">${i + 1}</span><span class="txt">${hl(t) || " "}</span></div>`;
}
const at = (row, col) => `top:${16 + row * 20}px;left:${5 + col}ch`;
function promptLabel() {
  return S.mode === "rewrite" ? `Rewrite · ${S.sel.e - S.sel.s + 1} lines` : `Insert · line ${S.cur.r + 1}`;
}
const replaceHint = () => S.req ? `<div class="line dim">↻ request running · &lt;CR&gt; replaces it</div>` : "";
const input = () => `<input class="prompt" id="in" spellcheck="false" placeholder="Instruction" value="${esc(S.draft).replace(/"/g, "&quot;")}">`;

function overlays() {
  let h = "";
  if (S.mode === "insert" && !(S.prompt && S.variant !== "C")) h += `<div class="cursor" style="${at(S.cur.r, S.cur.c)}"></div>`;
  const anchor = S.mode === "rewrite" ? [S.sel.e + 1, 0] : [S.cur.r + 1, S.cur.c];

  if (S.variant === "A") {
    if (S.prompt) h += `<div class="float" style="${at(...anchor)};width:46ch;margin-top:6px">
      <span class="title"> ${promptLabel()} </span>
      <div class="line"><span class="dim">❯ </span>${input()}</div>${replaceHint()}</div>`;
    if (S.req) {
      const [row] = targetRows(S.req);
      h += `<div class="virt" style="${at(row, S.lines[row].length + 2)}">${spin()} nvimpi ${elapsed()} · &lt;C-c&gt; cancel</div>`;
    }
  }
  if (S.variant === "B" && (S.prompt || S.req)) {
    const working = S.req && !S.prompt;
    const label = working
      ? (S.req.mode === "rewrite" ? `Rewrite · lines ${S.req.target.s + 1}–${S.req.target.e + 1}` : `Insert · line ${S.req.target.r + 1}`)
      : (S.mode === "rewrite" ? `Rewrite · lines ${S.sel.s + 1}–${S.sel.e + 1}` : `Insert · line ${S.cur.r + 1}`);
    h += `<div class="float" style="top:${16 + 3 * 20}px;left:50%;transform:translateX(-50%);width:62ch;padding:8px 2ch">
      <span class="title"> nvimpi </span>
      <div class="line dim">${label} · lua</div>
      ${working
        ? `<div class="line dim">❯ ${esc(S.req.instr)}</div><div class="line">${spin()} Working… ${elapsed()}</div>`
        : `<div class="line"><span class="dim">❯ </span>${input()}</div>${replaceHint()}`}
      <span class="foot"> ${working ? "&lt;C-c&gt; cancel" : "&lt;CR&gt; send · &lt;Esc&gt; close"} </span></div>`;
  }
  return h;
}
function statusline() {
  const mode = S.prompt ? (S.variant === "C" ? "COMMAND" : "INSERT") : S.mode === "rewrite" ? "V-LINE" : "NORMAL";
  const right = (S.variant === "C" && S.req ? `${spin()} nvimpi ${elapsed()}  ` : "") +
    (S.mode === "rewrite" ? `${S.sel.e - S.sel.s + 1}L` : `${S.cur.r + 1}:${S.cur.c + 1}`);
  return `<div class="status"><span><span class="mode">${mode}</span> lua/stats.lua${S.undo.length ? " [+]" : ""}</span><span>${right}</span></div>`;
}
function cmdline() {
  if (S.variant === "C" && S.prompt) {
    const pre = S.mode === "rewrite" ? `Rewrite ${S.sel.s + 1},${S.sel.e + 1}❯ ` : `Insert ${S.cur.r + 1}:${S.cur.c + 1}❯ `;
    return `<div class="cmd"><span class="dim">${pre}</span>${input()}${S.req ? `<span class="dim"> (replaces running)</span>` : ""}</div>`;
  }
  const m = S.msg && Date.now() - S.msg.at < 5000 ? S.msg : null;
  return `<div class="cmd ${m ? m.level : ""}">${m ? esc(m.text) : " "}</div>`;
}
function renderState() {
  const r = S.req;
  $("state").innerHTML =
    `<b>variant</b> ${S.variant} (${VARIANTS[S.variant]})   <b>mode</b> ${S.mode}${S.mode === "insert" ? " / " + S.placement : ""}   <b>prompt</b> ${S.prompt ? "open" : "closed"}   <b>undo steps</b> ${S.undo.length}\n` +
    `<b>request</b> ${r ? `#${r.id} "${esc(r.instr)}" ${elapsed()}${r.dirty ? " (target edited)" : ""}` : "none"}   ` +
    `<b>lastFailed</b> ${S.lastFailed ? `"${esc(S.lastFailed)}"` : "none"}\n` +
    `<b>log</b> ${S.log.map(esc).join("  →  ") || "–"}`;
}
function render() {
  const old = $("in");
  const draft = old ? old.value : S.draft, focused = old && document.activeElement === old, caret = old ? old.selectionStart : null;
  if (old) S.draft = draft;
  renderControls();
  let rows = "";
  for (let i = 0; i < ROWS; i++) rows += rowHtml(i);
  $("ed").innerHTML = rows + statusline() + cmdline() + overlays();
  renderState();
  const inp = $("in");
  if (inp) {
    inp.value = S.draft;
    if (focused || !old) { inp.focus(); if (caret != null) inp.setSelectionRange(caret, caret); }
  }
}

// ---- input --------------------------------------------------------------
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.set) { if (b.dataset.set !== "variant" || !S.prompt) S[b.dataset.set] = b.dataset.val; return render(); }
  ({ rewrite: () => setMode("rewrite"), insert: () => setMode("insert"), open: openPrompt, cancel, edit: editTarget, undo, reset })[b.dataset.act]?.();
});
let leaderAt = 0;
document.addEventListener("keydown", (e) => {
  if (e.target.id === "in") {
    if (e.key === "Enter") { e.preventDefault(); submit(e.target.value); }
    else if (e.key === "Escape" || (e.ctrlKey && e.key === "c")) { e.preventDefault(); S.draft = ""; closePrompt(); }
    return;
  }
  if (e.ctrlKey && e.key === "c") { e.preventDefault(); return cancel(); }
  if (e.key === " ") { e.preventDefault(); leaderAt = Date.now(); return; }
  if (e.key === "a" && Date.now() - leaderAt < 1000) { e.preventDefault(); return openPrompt(); }
  if (e.key === "V") return setMode("rewrite");
  if (e.key === "Escape") return setMode("insert");
  if (e.key === "u") return undo();
  const keys = Object.keys(VARIANTS);
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !S.prompt) {
    const i = keys.indexOf(S.variant) + (e.key === "ArrowRight" ? 1 : -1);
    S.variant = keys[(i + keys.length) % keys.length]; render();
  }
});
setInterval(() => { S.tick++; if (S.req || S.msg) render(); }, 90);
render();
</script>
</body>
</html>
